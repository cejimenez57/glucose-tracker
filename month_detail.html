<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monthly Blood Sugar Log</title>
    <link rel="stylesheet" href="../users_style.css">
</head>
<body>

    <div class="detail_main">

        <header class="detail-header">
            <h1 id="sheet-title">Blood Sugar Log</h1>
        </header>

        <table class="log-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Before Meal</th>
                    <th>After Meal</th>
                    <th>Notes</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="log-rows">
                <tr>
                    <td><input type="date"></td>
                    <td><input type="time"></td>
                    <td><input type="number"></td>
                    <td><input type="number"></td>
                    <td><input type="text"></td>
                    <td><button class="delete-row">X</button></td>
                </tr>

                <tr>
                    <td><input type="date"></td>
                    <td><input type="time"></td>
                    <td><input type="number"></td>
                    <td><input type="number"></td>
                    <td><input type="text"></td>
                    <td><button class="delete-row">X</button></td>
                </tr>

                <tr>
                    <td><input type="date"></td>
                    <td><input type="time"></td>
                    <td><input type="number"></td>
                    <td><input type="number"></td>
                    <td><input type="text"></td>
                    <td><button class="delete-row">X</button></td>
                </tr>

                <tr>
                    <td><input type="date"></td>
                    <td><input type="time"></td>
                    <td><input type="number"></td>
                    <td><input type="number"></td>
                    <td><input type="text"></td>
                    <td><button class="delete-row">X</button></td>
                </tr>
            </tbody>

            <tfoot>
                <tr class="average-row">
                    <td colspan="3">Average Glucose</td>
                    <td id="average-value">N/A</td>
                    <td colspan="2"></td>
                </tr>
            </tfoot>
        </table>

        <div class="controls">
            <button id="add-row-button">Add Row</button>
            <button id="save-button">Save</button>
            <button id="back-button">Back to Months</button>
        </div>

    </div>

    <script src="../Javascript/month_detail.js"></script>
</body>
</html>
